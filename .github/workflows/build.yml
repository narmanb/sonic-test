name: Build Aurora Rush

on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6"
  GODOT_RELEASE: "4.6-stable"
  GODOT_TEMPLATES: "4.6.stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_TEMPLATES}
          base=https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}
          curl -fsSL -o /tmp/godot.zip ${base}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz ${base}/Godot_v${GODOT_RELEASE}_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_TEMPLATES}/

      - name: Configure Android export (debug keystore + SDK paths)
        run: |
          mkdir -p ~/.config/godot ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          for f in editor_settings-${GODOT_VERSION}.tres editor_settings-4.tres; do
          cat > ~/.config/godot/$f <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^          //' ~/.config/godot/$f
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${HOME}/.android/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Import project
        run: ~/godot/godot --headless --path game --import

      - name: Movement tests
        run: ~/godot/godot --headless --fixed-fps 60 --path game -- --test

      - name: Island tests
        run: ~/godot/godot --headless --fixed-fps 60 --path game -- --test-island

      - name: Export Android APK
        run: |
          mkdir -p build
          ~/godot/godot --headless --path game --export-debug "Android" ../build/aurora-rush.apk
          ls -la build
          test -s build/aurora-rush.apk

      - name: Export Linux and Windows
        run: |
          mkdir -p build/linux build/windows
          ~/godot/godot --headless --path game --export-debug "Linux" ../build/linux/aurora-rush.x86_64
          ~/godot/godot --headless --path game --export-debug "Windows" ../build/windows/aurora-rush.exe

      - name: Smoke-test the exported Linux build
        run: |
          chmod +x build/linux/aurora-rush.x86_64
          build/linux/aurora-rush.x86_64 --headless --fixed-fps 60 -- --test-island --only=terrain,tokens,loop,hollow

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-rush-android-apk
          path: build/aurora-rush.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-rush-linux
          path: build/linux

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-rush-windows
          path: build/windows
